# Monthly, one grouped PR per ecosystem, minor and patch updates only.
# Major updates change APIs, so they are done by hand, one at a time.
# Security updates still come as soon as GitHub finds a problem.
version: 2
updates:
  - package-ecosystem: cargo
    directory: /
    schedule: { interval: monthly }
    groups:
      cargo:
        patterns: ["*"]
        update-types: [minor, patch]
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]
  - package-ecosystem: github-actions
    directory: /
    schedule: { interval: monthly }
    groups:
      actions: { patterns: ["*"] }
  - package-ecosystem: docker
    directory: /deploy
    schedule: { interval: monthly }
    groups:
      docker: { patterns: ["*"] }
  - package-ecosystem: npm
    directory: /web
    schedule: { interval: monthly }
    groups:
      web:
        patterns: ["*"]
        update-types: [minor, patch]
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]
