# Run from deploy/: docker compose -f docker-compose.prod.yml --env-file ../.env up -d
# .env must set POSTGRES_PASSWORD plus the Mailrust settings (PUBLIC_URL, TRACKING_SECRET, MAILRUST_SENDER, SES ...).
x-mailrust-env: &mailrust-env
  DATABASE_URL: postgres://mailrust:${POSTGRES_PASSWORD}@postgres:5432/mailrust
  BIND_ADDR: 0.0.0.0:8080
  RUST_LOG_FORMAT: json

services:
  postgres:
    image: postgres:17
    restart: unless-stopped
    environment:
      POSTGRES_USER: mailrust
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: mailrust
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U mailrust"]
      interval: 5s
      retries: 20

  migrate:
    build: { context: .., dockerfile: deploy/Dockerfile }
    command: ["migrate"]
    env_file: ../.env
    environment: *mailrust-env
    depends_on:
      postgres: { condition: service_healthy }
    restart: "no"

  mailrust:
    build: { context: .., dockerfile: deploy/Dockerfile }
    command: ["serve"]
    env_file: ../.env
    environment: *mailrust-env
    depends_on:
      migrate: { condition: service_completed_successfully }
    restart: unless-stopped

  caddy:
    image: caddy:2
    restart: unless-stopped
    ports: ["80:80", "443:443"]
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
    depends_on: [mailrust]

  backup:
    image: postgres:17
    restart: unless-stopped
    environment:
      DATABASE_URL: postgres://mailrust:${POSTGRES_PASSWORD}@postgres:5432/mailrust
    volumes:
      - ./backup.sh:/backup.sh:ro
      - ./backups:/backups
    entrypoint: ["sh", "-c", "while true; do /backup.sh || echo 'backup failed'; sleep 86400; done"]
    depends_on:
      postgres: { condition: service_healthy }

volumes:
  pgdata:
  caddy_data:
