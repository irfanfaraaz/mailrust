# cargo deny check: known security holes, licenses, crate sources.
[graph]
all-features = true

[advisories]
version = 2
yanked = "deny"
ignore = [
    # Marvin attack: timing leaks the PRIVATE key while decrypting or signing.
    # Mailrust only verifies SNS signatures with Amazon's PUBLIC key; private keys appear in tests only.
    # No fixed rsa release exists yet.
    { id = "RUSTSEC-2023-0071", reason = "only public-key verify in production; no fix released" },
]

[licenses]
version = 2
# Licenses that can ship inside an AGPL-3.0 program.
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "0BSD",
    "Zlib",
    "Unicode-3.0",
    "CDLA-Permissive-2.0",
    "MPL-2.0",
    "AGPL-3.0-or-later",
]
confidence-threshold = 0.9

[bans]
multiple-versions = "allow"
wildcards = "deny"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
